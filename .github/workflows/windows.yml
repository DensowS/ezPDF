name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: ./scripts/verify-windows.ps1
      - name: Test packaged desktop application
        run: npm run test:desktop
        env:
          EZPDF_EXECUTABLE: '${{ github.workspace }}\release\win-unpacked\ezPDF.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: ezPDF-Windows-x64
          path: release/*.exe
